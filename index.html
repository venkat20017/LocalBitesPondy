<!doctype html>
<html lang="en">

<head>
  <!-- Google Consent Mode v2 defaults — MUST be first, before GTM/GA loads -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // Set default consent to 'denied' as a placeholder.
    // Determine actual values based on your own requirements / user's region.
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });

    // Re-apply previously granted consent on repeat visits
    try {
      if (localStorage.getItem('cookie_consent') === 'granted') {
        gtag('consent', 'update', {
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted',
          'analytics_storage': 'granted'
        });
      }
    } catch (e) { /* localStorage unavailable — stay denied */ }
  </script>

  <!-- GTM and GA4 are now lazy-loaded. See script below. -->

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalBitesPondy</title>

  <!-- Preconnect to Sanity to speed up API calls and LCP images -->
  <link rel="preconnect" href="https://4mclrukh.api.sanity.io" crossorigin />
  <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />

  <!-- Site Identity for Search Engines -->
  <meta property="og:site_name" content="LocalBitesPondy" />
  <meta name="application-name" content="LocalBitesPondy" />
  <meta name="apple-mobile-web-app-title" content="LocalBitesPondy" />
  <meta property="og:url" content="https://localbitespondy.netlify.app/" />

  <!-- Global Website Schema -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LocalBitesPondy",
      "alternateName": "Local Bites Pondicherry",
      "url": "https://localbitespondy.netlify.app/",
      "description": "The ultimate local food guide for Pondicherry"
    }
  </script>

  <!-- Lazy Loaded Google Analytics (GA4) + Google Ads + GTM -->
  <script>
    let trackingLoaded = false;
    function initTracking() {
      if (trackingLoaded) return;
      trackingLoaded = true;

      // 1. Initialize dataLayer configurations
      gtag('js', new Date());
      gtag('config', 'G-7K5JPSBRQ2', { send_page_view: false });
      gtag('config', 'AW-17775750153');

      // 2. Load GA4 / Google Ads (gtag.js)
      const gtagScript = document.createElement('script');
      gtagScript.async = true;
      gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-7K5JPSBRQ2";
      document.head.appendChild(gtagScript);

      // 3. Load Google Tag Manager (gtm.js)
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-PSSSM8R6');
    }

    // Load immediately if in GTM Preview mode
    if (window.location.search.indexOf('gtm_preview') !== -1) {
      initTracking();
    } else {
      // Lazy load on first user interaction
      const interactEvents = ['scroll', 'mousemove', 'touchstart', 'keydown'];
      const loadOnInteract = () => {
        initTracking();
        interactEvents.forEach(e => window.removeEventListener(e, loadOnInteract));
      };
      interactEvents.forEach(e => window.addEventListener(e, loadOnInteract, { passive: true, once: true }));
      
      // Fallback: load after 3.5 seconds if no interaction occurs
      setTimeout(initTracking, 3500);
    }
  </script>

  <!-- Consent update helpers — invoked by the React consent banner -->
  <script>
    window.consentGrantAll = function () {
      gtag('consent', 'update', {
        'ad_storage': 'granted',
        'ad_user_data': 'granted',
        'ad_personalization': 'granted',
        'analytics_storage': 'granted'
      });
    };
    window.consentDenyAll = function () {
      gtag('consent', 'update', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied'
      });
    };
    // Granular helpers (kept for reference / future UI)
    window.consentGrantedAdStorage = function () {
      gtag('consent', 'update', { 'ad_storage': 'granted' });
    };
    window.consentGrantedAnalyticsStorage = function () {
      gtag('consent', 'update', { 'analytics_storage': 'granted' });
    };
  </script>
</head>

  <!-- End Google Tag Manager (noscript) -->

</html>
