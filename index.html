<!doctype html>
<html lang="en">

<head>
  <!-- Google Consent Mode v2 defaults — MUST be first, before GTM/GA loads -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // Set default consent to 'denied' as a placeholder.
    // Determine actual values based on your own requirements / user's region.
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });

    // Re-apply previously granted consent on repeat visits
    try {
      if (localStorage.getItem('cookie_consent') === 'granted') {
        gtag('consent', 'update', {
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted',
          'analytics_storage': 'granted'
        });
      }
    } catch (e) { /* localStorage unavailable — stay denied */ }
  </script>

  <!-- Google Tag Manager -->
  <script>(function (w, d, s, l, i) {
      w[l] = w[l] || []; w[l].push({
        'gtm.start':
          new Date().getTime(), event: 'gtm.js'
      }); var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-PSSSM8R6');</script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ea580c" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Speed up the first Sanity CDN handshake. dns-prefetch covers the
       API host we hit at runtime once content is published. -->
  <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
  <link rel="dns-prefetch" href="https://4mclrukh.apicdn.sanity.io" />

  <!--
    Default tags below are FALLBACKS for non-JS social scrapers.
    React 19's PageSEO renders per-page <title> + <meta> at runtime,
    which Googlebot reads after JS execution. For full per-page social
    previews on Facebook/X/Slack, add prerendering in Phase 9.
  -->
  <title>Famous Food in Pondicherry — LocalBitesPondy</title>
  <meta name="description"
    content="Hand-picked restaurants, French heritage cafés, and street food spots in Pondicherry — locally vetted with Google Maps links. Free PDF food guide." />
  <link rel="canonical" href="https://localbitespondy.com/" />

  <!-- Site identity for search engines -->
  <meta property="og:site_name" content="LocalBitesPondy" />
  <meta name="application-name" content="LocalBitesPondy" />
  <meta name="apple-mobile-web-app-title" content="LocalBitesPondy" />

  <!-- Default Open Graph (PageSEO overrides for inner pages at runtime) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://localbitespondy.com/" />
  <meta property="og:title" content="Famous Food in Pondicherry — LocalBitesPondy" />
  <meta property="og:description"
    content="Hand-picked restaurants, French heritage cafés, and street food spots in Pondicherry — locally vetted with Google Maps links." />
  <meta property="og:image" content="https://localbitespondy.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card defaults -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://localbitespondy.com/" />
  <meta name="twitter:title" content="Famous Food in Pondicherry — LocalBitesPondy" />
  <meta name="twitter:description"
    content="Hand-picked restaurants and food spots in Pondicherry, written by locals." />
  <meta name="twitter:image" content="https://localbitespondy.com/og-image.jpg" />

  <!-- WebSite Schema (PageSEO emits a richer one at runtime) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LocalBitesPondy",
      "alternateName": "Local Bites Pondicherry",
      "url": "https://localbitespondy.com/",
      "description": "The local food guide for Pondicherry — hand-picked restaurants, French heritage cafés, and street food spots, with Google Maps links."
    }
  </script>

  <!-- Google Analytics (GA4) + Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7K5JPSBRQ2"></script>
  <script>
    // dataLayer + gtag already initialized above for Consent Mode
    gtag('js', new Date());

    // send_page_view:false — this is a SPA; React fires page_view on every
    // route change via usePageTracking. Disabling auto-fire prevents the
    // initial HTML load from double-counting the first pageview.
    gtag('config', 'G-7K5JPSBRQ2', { send_page_view: false });
    gtag('config', 'AW-17775750153');
  </script>

  <!-- Consent update helpers — invoked by the React consent banner -->
  <script>
    window.consentGrantAll = function () {
      gtag('consent', 'update', {
        'ad_storage': 'granted',
        'ad_user_data': 'granted',
        'ad_personalization': 'granted',
        'analytics_storage': 'granted'
      });
    };
    window.consentDenyAll = function () {
      gtag('consent', 'update', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied'
      });
    };
    // Granular helpers (kept for reference / future UI)
    window.consentGrantedAdStorage = function () {
      gtag('consent', 'update', { 'ad_storage': 'granted' });
    };
    window.consentGrantedAnalyticsStorage = function () {
      gtag('consent', 'update', { 'analytics_storage': 'granted' });
    };
  </script>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PSSSM8R6" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!--
    Netlify Forms — static form for build-time detection.
    The runtime form is rendered by React in LeadModal.tsx and POSTs
    application/x-www-form-urlencoded with form-name=lead-capture.
    Honeypot field "bot-field" is checked by Netlify automatically.
  -->
  <form name="lead-capture" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="source" />
    <input type="text" name="bot-field" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
